
name: Spampafy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Instalar SDK Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar Spampafy
        run: gradle assembleDebug

      - name: Inspeccionar motor Opus
        run: |
          AAR=$(find ~/.gradle/caches/modules-2/files-2.1/io.element.android/opusencoder/1.2.0 -name "*.aar" | head -n 1)

          if [ -z "$AAR" ]; then
            echo "No se encontró la biblioteca Opus"
            exit 1
          fi

          unzip -p "$AAR" classes.jar > /tmp/opusencoder.jar

          echo "=== CLASES OPUS ==="
          jar tf /tmp/opusencoder.jar | grep -i opus

          echo "=== METODOS DISPONIBLES ==="
          for CLASS in $(jar tf /tmp/opusencoder.jar | grep '\.class$' | grep -v '\$' | sed 's#/#.#g;s#\.class$##'); do
            javap -classpath /tmp/opusencoder.jar -p "$CLASS"
          done

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Spampafy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
