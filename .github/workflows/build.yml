name: Spampafy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar keystore Debug en la ruta que usa Gradle
        run: |
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Keystore generado en:"
          ls -l "$KEYSTORE"

      - name: Obtener huella SHA-1
        run: |
          gradle :app:signingReport

      - name: Compilar APK Debug
        run: |
          gradle assembleDebug --stacktrace --info

      - name: Inspeccionar biblioteca OPUS
        if: always()
        run: |
          echo "Buscando la biblioteca OPUS en la caché de Gradle..."
          find "$HOME/.gradle/caches/modules-2/files-2.1/io.element.android/opusencoder/1.2.0" \
            -type f \( -name "*.aar" -o -name "*.jar" \) -print 2>/dev/null || true

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Spampafy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
